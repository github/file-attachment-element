name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag_version:
        description: Existing tag version to publish
        required: true
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_version || github.event.release.tag_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --silent
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG_NAME }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm version "${TAG_NAME}" --git-tag-version=false --allow-same-version
      - run: npm --ignore-scripts publish --provenance --access public
